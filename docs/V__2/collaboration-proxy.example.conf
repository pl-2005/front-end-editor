# Nginx server-scope snippet. Render ${COLLABORATION_ENABLED} from the deployment
# environment; replace the exact Origin entries with the production allowlist.
map "${COLLABORATION_ENABLED}" $collaboration_enabled {
    default 0;
    "true"  1;
}

map $http_origin $collaboration_origin_allowed {
    default                  0;
    "http://localhost:5173" 1;
}

server {
    # Keep this location ahead of broad API proxy locations.
    location ^~ /internal/ {
        return 404;
    }

    location = /collab {
        if ($collaboration_enabled = 0) { return 404; }
        if ($collaboration_origin_allowed = 0) { return 403; }

        proxy_pass http://127.0.0.1:1234/collab;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
