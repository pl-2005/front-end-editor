# Include inside nginx's http context. Change server_name, certificate paths,
# and the immutable release directory together before nginx -t / reload.
map $http_upgrade $editor_connection {
    default upgrade;
    '' close;
}
server {
    listen 443 ssl;
    server_name editor.example.invalid;
    ssl_certificate /etc/web-editor/tls/fullchain.pem;
    ssl_certificate_key /etc/web-editor/tls/privkey.pem;
    root /srv/web-editor/releases/RELEASE_ID/frontend/dist;
    client_max_body_size 16m;
    # Request URLs/bodies and credentials are not written to access logs.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location ~ /\. { return 404; }

    location = /api { return 404; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
    location = /collaboration {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $editor_connection;
        proxy_set_header Host $host;
        # Preserve the browser Origin; the gateway checks an exact allowlist.
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location ^~ /collaboration/ { return 404; }
    location = /collab { return 404; }
    location ^~ /collab/ { return 404; }
    location /assets/ { try_files $uri =404; }
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
