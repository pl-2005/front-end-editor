spring:
  profiles:
    active: test
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    target: '3'
  datasource:
    url: jdbc:h2:mem:web_editor;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:collab-control-schema.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

editor:
  auth:
    issuer: web-editor
    audience: web-editor-api
    access-ttl: 10m
    secret: test-only-hs256-secret-with-at-least-32-bytes
    refresh-idle-timeout: 30m
    refresh-max-lifetime: 12h
    max-refresh-families-per-user: 5
    redis-namespace: web-editor:test-auth
  storage:
    minio:
      endpoint: http://localhost:9000
      access-key: test-access-key
      secret-key: test-secret-key
      bucket: web-editor-test
      initialize-bucket: false
