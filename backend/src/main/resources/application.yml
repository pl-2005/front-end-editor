spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: web-editor-backend
  data:
    redis:
      timeout: 2s
      connect-timeout: 2s
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/web_editor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:web_editor}
    password: ${DB_PASSWORD:web_editor}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

editor:
  collaboration:
    creation-enabled: ${COLLAB_CREATION_ENABLED:false}
    ticket-enabled: ${COLLAB_TICKET_ENABLED:false}
    storage-secret: ${COLLAB_STORAGE_SECRET:}
    maintenance:
      enabled: ${COLLAB_MAINTENANCE_ENABLED:false}
      secret: ${COLLAB_MAINTENANCE_SECRET:}
    gateway:
      enabled: ${COLLAB_GATEWAY_ENABLED:false}
      url: ${COLLAB_GATEWAY_INTERNAL_URL:http://127.0.0.1:8092}
      secret: ${COLLAB_GATEWAY_SECRET:}
    initializer:
      url: ${COLLAB_INITIALIZER_URL:http://127.0.0.1:8091/internal/initialize}
      secret: ${COLLAB_INITIALIZER_SECRET:}
    cleanup:
      recovery-window: ${COLLAB_RECOVERY_WINDOW:30d}
      confirmation-window: ${COLLAB_CONFIRMATION_WINDOW:24h}
      cron: ${COLLAB_CLEANUP_CRON:0 0 4 * * *}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    local-development: ${AUTH_LOCAL_DEVELOPMENT:false}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS}
    issuer: ${JWT_ISSUER:web-editor}
    audience: ${JWT_AUDIENCE:web-editor-api}
    access-ttl: ${JWT_ACCESS_TTL:10m}
    secret: ${JWT_SECRET}
    refresh-idle-timeout: ${AUTH_REFRESH_IDLE_TIMEOUT:30m}
    refresh-max-lifetime: ${AUTH_REFRESH_MAX_LIFETIME:12h}
    max-refresh-families-per-user: ${AUTH_MAX_REFRESH_FAMILIES_PER_USER:5}
    redis-namespace: ${AUTH_REDIS_NAMESPACE:web-editor:auth}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:web-editor}
      initialize-bucket: ${MINIO_INITIALIZE_BUCKET:true}
    orphan-cleanup:
      cron: ${ORPHAN_CLEANUP_CRON:0 30 3 * * *}
      grace-period: ${ORPHAN_CLEANUP_GRACE_PERIOD:24h}

server:
  error:
    include-message: never
    include-stacktrace: never
